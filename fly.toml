# Fly.io deployment. Create the volume once before the first deploy:
#   fly volumes create recap_data --size 1 --region nrt
app = "recap-study-agent"
primary_region = "nrt"

[build]

[env]
  # The site is HTTPS-only on Fly, so the login cookie never travels in clear text.
  COOKIE_SECURE = "true"

# SQLite (tracker.db) and per-project FAISS indexes live under /app/data,
# so mounting the volume there keeps them across deploys and restarts.
[mounts]
  source = "recap_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
